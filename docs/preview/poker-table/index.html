<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Red Ass - phone poker-style table, 3D (TEST)</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Red Ass brand palette (project/BRAND-KIT.md): table blue #17202B, glow #1E2A38, lamp #22324A,
   cream #FBF8F3, ink #1A1F2B, burn red #C4211B, gold #E8AB35, ember #FF5A4F, text #E9EDF3, muted #A3AFC0.
   Art (Social, branch social/table-3d-art): every .webp is loaded by RELATIVE path, so keep the files
   beside this page. If one is missing the page still works with plain CSS fallbacks. */
:root{
  --blue:#17202b; --glow:#1e2a38; --lamp:#22324a;
  --cream:#fbf8f3; --ink:#1a1f2b; --red:#c4211b; --red-hover:#a01a15; --ember:#ff5a4f;
  --gold:#e8ab35; --text:#e9edf3; --smoke:#a3afc0;
  --font-display:'Oswald','Arial Narrow',Arial,sans-serif;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --draw-zone:104px;            /* space under the felt for the DRAW button */
  --cw:64px; --ch:90px;         /* hand card size (5:7) */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%; overflow:hidden; max-width:100%}
body{
  font-family:var(--font-body); color:var(--text); overflow:hidden; height:100dvh;
  background:#0c1118 url(soc-room-backdrop.webp) center/cover no-repeat;
  display:flex; flex-direction:column;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;
}
.stage{position:relative; flex:1 1 auto; min-height:0; overflow-x:clip; overflow-y:visible}

/* ---------- TABLE (Social's art, stretched to the stage) ---------- */
.tbl{
  position:absolute; left:-4%; right:-4%; top:-6%; bottom:-8%;
  background:url(soc-table-top.webp) center/100% 100% no-repeat;
}
/* rail lighting: a warm lamp glint on the upper rail and a cool wash on the felt */
.tbl::before{
  content:""; position:absolute; inset:0; pointer-events:none; mix-blend-mode:screen;
  background:
    radial-gradient(38% 9% at 38% 9%, rgba(255,214,190,.30), rgba(255,214,190,0) 70%),
    radial-gradient(60% 34% at 50% 40%, rgba(130,170,230,.20), rgba(130,170,230,0) 72%);
}
.tbl::after{ /* soft darkening toward the near rail so the lower felt reads as nearer and shaded */
  content:""; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(180deg, rgba(0,0,0,0) 62%, rgba(0,0,0,.28) 100%);
  -webkit-mask:url(soc-table-top.webp) center/100% 100% no-repeat; mask:url(soc-table-top.webp) center/100% 100% no-repeat;
}

/* ---------- PILES on a tilted plane ---------- */
.piles{position:absolute; left:50%; top:58%; transform:translate(-50%,-50%); z-index:3; display:flex; gap:26px; align-items:flex-start}
.pile{display:flex; flex-direction:column; align-items:center; gap:14px}
.plane{perspective:520px}
.stack{position:relative; width:64px; height:90px; transform:rotateX(24deg); transform-style:preserve-3d}
.stack::before{ /* contact shadow on the felt */
  content:""; position:absolute; left:-6px; right:-10px; top:10px; bottom:-12px; border-radius:50%/40%;
  background:radial-gradient(closest-side, rgba(0,0,0,.6), rgba(0,0,0,0)); filter:blur(3px); transform:translateZ(-1px);
}
.card{
  position:absolute; width:64px; height:90px; border-radius:8px;
  box-shadow:0 1px 1px rgba(0,0,0,.55), 0 3px 5px rgba(0,0,0,.45), 0 9px 14px -3px rgba(0,0,0,.55);
}
.card.back{background:url(soc-card-back.webp) center/100% 100% no-repeat; box-shadow:0 1px 1px rgba(0,0,0,.6), 0 4px 6px rgba(0,0,0,.45), 0 10px 14px -3px rgba(0,0,0,.55)}
.face{
  background:linear-gradient(150deg,#ffffff 0%, var(--cream) 48%, #ece3d3 100%);
  border:1px solid rgba(26,31,43,.45); color:var(--ink);
}
.face::after{content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background:linear-gradient(120deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 35%, rgba(0,0,0,.08) 100%)}
.face .rk{position:absolute; left:6px; top:4px; font:600 22px/1 var(--font-display); color:var(--red); text-shadow:none}
.face.ink .rk{color:var(--ink)}
.card .mf{position:absolute; left:7px; top:29px; width:13px; height:13px; opacity:.95}
.card .fl{position:absolute; left:50%; top:58%; width:48%; height:auto; transform:translate(-50%,-50%); filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.lbl{
  font:700 16px/1 var(--font-body); color:var(--text); letter-spacing:.02em; white-space:nowrap;
  padding:5px 12px; border-radius:12px; background:rgba(12,17,24,.72);
  border:1px solid rgba(232,171,53,.55); box-shadow:0 2px 4px rgba(0,0,0,.5);
}

/* ---------- SEATS ---------- */
.seat{position:absolute; width:96px; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; z-index:4}
.fan{position:absolute; top:6px; left:50%; width:0; height:0}
.fan i{position:absolute; width:26px; height:36px; background:url(soc-card-back.webp) center/100% 100% no-repeat; border-radius:4px;
  box-shadow:0 2px 4px rgba(0,0,0,.6); left:-13px; top:0}
.fan i:nth-child(1){transform:translate(-26px,2px) rotate(-18deg)}
.fan i:nth-child(2){transform:translate(26px,2px) rotate(18deg)}
.badge{position:relative; width:76px; height:76px; transition:transform .25s ease, filter .25s;
  filter:drop-shadow(0 6px 5px rgba(0,0,0,.55)) drop-shadow(0 12px 12px rgba(0,0,0,.35))}
.badge .pic{position:absolute; inset:11%; border-radius:50%; overflow:hidden; background:var(--glow); box-shadow:inset 0 4px 8px rgba(0,0,0,.65)}
.badge .pic svg{display:block; width:100%; height:100%}
.badge .frame{position:absolute; inset:0; width:100%; height:100%; background:url(soc-seat-frame.webp) center/100% 100% no-repeat}
.cnt{
  position:absolute; right:-6px; bottom:-2px; min-width:30px; height:30px; padding:0 6px; z-index:2;
  display:grid; place-items:center; border-radius:15px;
  background:var(--cream); color:var(--ink); border:2px solid var(--ink);
  font:700 17px/1 var(--font-body); box-shadow:0 2px 4px rgba(0,0,0,.6);
}
.plate{
  position:relative; margin-top:-8px; width:96px; height:32px; padding-bottom:6px; display:grid; place-items:center; z-index:1;
  background:url(soc-seat-nameplate.webp) center/100% 100% no-repeat;
  font:700 16px/1 var(--font-body); color:var(--text); white-space:nowrap;
  text-shadow:0 1px 2px rgba(0,0,0,.9);
  filter:drop-shadow(0 4px 4px rgba(0,0,0,.55));
  transition:transform .25s ease;
}
/* whose turn: ember-glow frame, lifted + larger plate, and a pointer shape (not colour alone) */
.mark{display:none; position:absolute; top:-15px; left:50%; width:0; height:0; margin-left:-11px; z-index:3;
  border-left:11px solid transparent; border-right:11px solid transparent; border-top:15px solid var(--gold);
  filter:drop-shadow(0 0 0 var(--ink)) drop-shadow(0 2px 2px rgba(0,0,0,.7)); animation:bob 1.6s ease-in-out infinite}
.seat.turn .mark{display:block}
.seat.turn .badge{transform:translateY(-6px) scale(1.1)}
.seat.turn .badge .frame{background-image:url(soc-seat-frame-active.webp)}
.seat.turn .plate{transform:translateY(-4px) scale(1.1); color:#fff3d2}
@keyframes bob{50%{transform:translateY(4px)}}
@media (prefers-reduced-motion:reduce){.mark{animation:none}}
.vh{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

/* piles sit lower with many seats, nearer the middle with few */
.n4 .piles{top:52%}
.n3 .piles{top:50%}
.n2 .piles{top:50%}
@media (max-height:800px){
  .seat{transform:translate(-50%,-50%) scale(.86)}
  .slot-LU,.slot-RU{top:21%}
  .slot-LL,.slot-RL{top:37%}
  .piles{top:60%}
  .n4 .piles{top:54%}.n3 .piles{top:52%}.n2 .piles{top:50%}
}
/* seat slots (centres, % of stage) */
.slot-T {left:50%; top:12%}
.slot-LU{left:16.5%; top:23%}  .slot-RU{left:83.5%; top:23%}
.slot-LL{left:16.5%; top:37%}  .slot-RL{left:83.5%; top:37%}

/* ---------- HAND (over the lower felt) ---------- */
.hand{position:absolute; left:0; right:0; bottom:10px; height:calc(var(--ch) + 40px); z-index:5; perspective:700px; pointer-events:none}
.hand .you{
  position:absolute; left:50%; bottom:calc(var(--ch) + 8px); transform:translateX(-50%);
  font:700 16px/1 var(--font-body); color:var(--text); padding:5px 14px; border-radius:12px;
  background:rgba(12,17,24,.72); border:1px solid rgba(232,171,53,.55); box-shadow:0 2px 4px rgba(0,0,0,.5); white-space:nowrap;
}
.hand button.card{
  all:unset; box-sizing:border-box; position:absolute; bottom:0; left:50%; pointer-events:auto;
  width:var(--cw); height:var(--ch); border-radius:8px; cursor:pointer;
  transform-origin:50% 150%;
  transform:translateX(calc(-50% + var(--x))) translateY(var(--y)) rotate(var(--r));
  transition:transform .2s cubic-bezier(.2,.8,.3,1), box-shadow .2s;
  box-shadow:-2px 2px 3px rgba(0,0,0,.5), -5px 9px 12px rgba(0,0,0,.5);
  background:linear-gradient(150deg,#ffffff 0%, var(--cream) 48%, #ece3d3 100%);
  border:1px solid rgba(26,31,43,.45);
  color:var(--ink);
}
.hand button.card::after{content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background:linear-gradient(120deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 35%, rgba(0,0,0,.1) 100%)}
.hand button.card .rk{font-size:24px}
.hand button.card.up{
  z-index:50 !important;
  transform:translateX(calc(-50% + var(--x))) translateY(calc(var(--y) - 34px)) rotate(0deg) rotateX(-12deg) rotateY(-9deg) scale(1.16);
  box-shadow:-6px 14px 10px rgba(0,0,0,.4), -12px 30px 24px rgba(0,0,0,.45), 0 0 0 2px rgba(232,171,53,.9);
}
.hand button.card:focus-visible{outline:3px solid var(--gold); outline-offset:2px}

/* ---------- DRAW ---------- */
.drawzone{flex:0 0 auto; height:var(--draw-zone); padding:34px 0 14px; display:flex; justify-content:center; position:relative; z-index:6}
.draw{
  appearance:none; border:0; cursor:pointer; width:min(84%,330px); height:58px; border-radius:30px;
  font:600 28px/1 var(--font-display); letter-spacing:.14em; text-transform:uppercase; color:var(--cream);
  background:linear-gradient(#e8443a 0%, var(--red) 50%, #9a1812 100%);
  box-shadow:0 0 0 2px #5c0d0a, 0 0 0 4px rgba(232,171,53,.75), 0 10px 16px rgba(0,0,0,.65), inset 0 2px 2px rgba(255,255,255,.45), inset 0 -4px 6px rgba(0,0,0,.35);
  text-shadow:0 2px 2px rgba(0,0,0,.5);
}
.draw:active{transform:translateY(3px); background:linear-gradient(#c4211b,var(--red-hover)); box-shadow:0 0 0 2px #5c0d0a, 0 0 0 4px rgba(232,171,53,.75), 0 4px 8px rgba(0,0,0,.6), inset 0 3px 6px rgba(0,0,0,.4)}
.draw:focus-visible{outline:3px solid var(--text); outline-offset:4px}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="tbl" id="tbl"></div>
  <div class="piles" id="piles"></div>
  <div id="seats"></div>
  <div class="hand" id="hand"></div>
</div>
<div class="drawzone"><button class="draw" id="draw" type="button">Draw</button></div>

<script>
/* ===== Fake sample data only. No real player data. =====
   ?players=2..6 (including you)  ?turn=0..4 (which opponent has the turn) */
var params = new URLSearchParams(location.search);
var PLAYERS = Math.max(2, Math.min(6, parseInt(params.get('players') || '6', 10) || 6));
var TURN = parseInt(params.get('turn') || '1', 10) || 0;
var OPPONENTS = [
  {name:'Mia',  n:7, skin:'#e2b48c', hair:'#3a2418', bg:'#6b2a2a', top:'#c4211b'},
  {name:'Dex',  n:5, skin:'#8d5a3b', hair:'#15110e', bg:'#1f4a5e', top:'#e8ab35'},
  {name:'Juno', n:9, skin:'#f1cfae', hair:'#b4531c', bg:'#3d2c63', top:'#4cc790'},
  {name:'Rae',  n:4, skin:'#c58c63', hair:'#2a1a12', bg:'#5a4a1c', top:'#ff5a4f'},
  {name:'Otis', n:6, skin:'#6b4430', hair:'#0f0c0a', bg:'#234a3a', top:'#fbf8f3'}
];
var SLOTS = {1:['T'], 2:['LU','RU'], 3:['LU','T','RU'], 4:['LL','LU','RU','RL'], 5:['LL','LU','T','RU','RL']};
var HAND = ['K','7','A','4','Q','9'];

function avatar(o){
  return '<svg viewBox="0 0 56 56" aria-hidden="true"><rect width="56" height="56" fill="'+o.bg+'"/>'
   +'<circle cx="28" cy="70" r="30" fill="'+o.top+'"/>'
   +'<rect x="23" y="30" width="10" height="10" fill="'+o.skin+'"/>'
   +'<ellipse cx="28" cy="23" rx="11" ry="12.5" fill="'+o.skin+'"/>'
   +'<path d="M16.5 22c-1-9 6-14 12-14s12 5 11 14c-3-5-6-7-11-7s-9 2-12 7z" fill="'+o.hair+'"/>'
   +'<circle cx="23.5" cy="24" r="1.4" fill="#1a1f2b"/><circle cx="32.5" cy="24" r="1.4" fill="#1a1f2b"/>'
   +'<path d="M24 30q4 3 8 0" stroke="#1a1f2b" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>';
}
function flame(cls){return '<svg class="'+cls+'" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5c1.5 4.6 7.2 6.6 7.2 13a7.2 7.2 0 0 1-14.4 0c0-3.6 2.4-5 3.2-8.2 1.4 1.2 2 .6 2.5-1.2.5-1.2.9-2.4 1.5-3.6z" fill="#c4211b"/><path d="M12 11c.9 2.6 3.6 3.6 3.6 6.6a3.6 3.6 0 0 1-7.2 0c0-1.8 1.2-2.6 1.6-4.2.7.7 1.4.3 1.6-.8z" fill="#e8ab35"/></svg>';}

function seat(o, slot, turn){
  return '<div class="seat slot-'+slot+(turn?' turn':'')+'" data-seat="'+o.name+'"'+(turn?' aria-current="true"':'')+'>'
   +'<div class="fan" aria-hidden="true"><i></i><i></i></div>'
   +'<div class="badge"><span class="mark" aria-hidden="true"></span><div class="pic">'+avatar(o)+'</div><div class="frame"></div>'
   +'<span class="cnt" aria-label="'+o.n+' cards">'+o.n+'</span></div>'
   +'<div class="plate">'+o.name+(turn?'<span class="vh"> is taking a turn</span>':'')+'</div></div>';
}
(function build(){
  var others = PLAYERS-1, slots = SLOTS[others], html='';
  document.getElementById('stage').className = 'stage n'+PLAYERS;
  for (var i=0;i<others;i++){ html += seat(OPPONENTS[i], slots[i], i===(TURN % others)); }
  document.getElementById('seats').innerHTML = html;

  document.getElementById('piles').innerHTML =
    '<div class="pile"><div class="plane"><div class="stack" role="img" aria-label="Draw pile, 38 cards">'
     +'<div class="card back" style="left:0;top:0"></div><div class="card back" style="left:-1px;top:-2px"></div><div class="card back" style="left:1px;top:-4px;transform:rotate(-2deg)"></div></div></div><div class="lbl">Draw 38</div></div>'
    +'<div class="pile"><div class="plane"><div class="stack" role="img" aria-label="Played pile, top card queen">'
     +'<div class="card face" style="left:-4px;top:1px;transform:rotate(-8deg)"><span class="rk">9</span></div>'
     +'<div class="card face ink" style="left:4px;top:-1px;transform:rotate(6deg)"><span class="rk">4</span></div>'
     +'<div class="card face" style="left:0;top:-3px;transform:rotate(-1deg)"><span class="rk">Q</span>'+flame('mf')+flame('fl')+'</div></div></div><div class="lbl">Played</div></div>';

  var h = document.getElementById('hand'), n = HAND.length, out='<div class="you">You</div>', mid=(n-1)/2;
  var step = Math.min(46, (window.innerWidth - 110) / (n-1));
  for (var j=0;j<n;j++){
    var d=j-mid;
    out += '<button type="button" class="card" aria-label="Card '+HAND[j]+'" aria-pressed="false"'
         + ' style="--x:'+(d*step).toFixed(1)+'px;--y:'+(d*d*1.8).toFixed(1)+'px;--r:'+(d*5.5).toFixed(1)+'deg;z-index:'+(j+1)+'">'
         + '<span class="rk" style="color:'+(j%2?'#1a1f2b':'#c4211b')+'">'+HAND[j]+'</span>'+flame('mf')+flame('fl')+'</button>';
  }
  h.innerHTML = out;
  h.addEventListener('click', function(e){
    var b = e.target.closest('button.card'); if(!b) return;
    var was = b.classList.contains('up');
    [].forEach.call(h.querySelectorAll('button.card.up'), function(x){x.classList.remove('up'); x.setAttribute('aria-pressed','false');});
    if(!was){ b.classList.add('up'); b.setAttribute('aria-pressed','true'); }
  });
})();
</script>
</body>
</html>
