<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Red Ass - phone poker-style table (TEST)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Red Ass brand palette (project/BRAND-KIT.md): table blue #17202B, glow #1E2A38, lamp #22324A,
   felt line #2C3B4D, cream #FBF8F3, ink #1A1F2B, burn red #C4211B, gold #E8AB35. No casino green. */
:root{
  --blue:#17202b; --glow:#1e2a38; --lamp:#22324a; --feltline:#2c3b4d;
  --cream:#fbf8f3; --ink:#1a1f2b; --red:#c4211b; --red-hover:#a01a15; --ember:#ff5a4f;
  --gold:#e8ab35; --text:#e9edf3; --smoke:#a3afc0;
  --font-display:'Oswald','Arial Narrow',Arial,sans-serif;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  /* Optional art hooks. Leave as none and the table is pure CSS/SVG. */
  --rail-art:none; --felt-art:none;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font-body); color:var(--text); overflow:hidden;
  background:radial-gradient(120% 90% at 50% 40%, #1e2a38 0%, #17202b 55%, #0c1118 100%);
  display:flex; flex-direction:column; height:100dvh;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  -webkit-tap-highlight-color:transparent;
}
.stage{position:relative; flex:1 1 auto; min-height:0; margin:0 0 0 0}

/* ---------- TABLE ---------- */
.table{position:absolute; left:3.5%; right:3.5%; top:1.5%; bottom:0;}
.rail,.felt,.stitch,.sheen{position:absolute; border-radius:999px}
.rail{
  inset:0;
  background:
    var(--rail-art),
    radial-gradient(140% 100% at 30% 10%, #9a2620 0%, #7a1a15 38%, #4a0e0b 100%);
  box-shadow:
    0 22px 38px -6px rgba(0,0,0,.65),
    0 6px 10px rgba(0,0,0,.5),
    inset 0 3px 3px rgba(255,200,190,.35),
    inset 0 -6px 10px rgba(0,0,0,.55),
    inset 8px 0 14px -6px rgba(0,0,0,.45),
    inset -8px 0 14px -6px rgba(0,0,0,.45);
  overflow:hidden;
}
.rail svg.grain{position:absolute; inset:0; width:100%; height:100%; opacity:.5; mix-blend-mode:overlay}
.sheen{ /* soft highlight along the top-left of the padded rail */
  inset:2px;
  background:linear-gradient(155deg, rgba(255,255,255,.30) 0%, rgba(255,255,255,.06) 24%, rgba(255,255,255,0) 40%),
             linear-gradient(335deg, rgba(0,0,0,.35) 0%, rgba(0,0,0,0) 35%);
  pointer-events:none;
}
.stitch{
  inset:9px;
  border:2px dashed rgba(251,248,243,.62);
  box-shadow:0 1px 0 rgba(0,0,0,.55), inset 0 1px 0 rgba(0,0,0,.35);
  pointer-events:none;
}
.felt{
  inset:22px;
  background:
    var(--felt-art),
    radial-gradient(75% 60% at 50% 46%, #2e4463 0%, #22324a 40%, #1a2535 78%, #131b27 100%);
  box-shadow:
    0 0 0 2px #14090a,
    0 0 0 3px rgba(232,171,53,.55),
    0 2px 3px 3px rgba(0,0,0,.6),
    inset 0 10px 22px 2px rgba(0,0,0,.75),
    inset 0 -4px 14px rgba(0,0,0,.5),
    inset 0 0 60px 8px rgba(0,0,0,.45);
  overflow:hidden;
}
.felt svg.grain{position:absolute; inset:0; width:100%; height:100%; opacity:.55; mix-blend-mode:soft-light}
.felt::after{ /* soft lamp light + vignette */
  content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background:radial-gradient(60% 45% at 50% 42%, rgba(120,160,220,.16), rgba(0,0,0,0) 70%),
             radial-gradient(100% 100% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.5) 100%);
}

/* ---------- PILES ---------- */
.piles{position:absolute; left:50%; top:47%; transform:translate(-50%,-50%); display:flex; gap:20px; align-items:flex-start; z-index:2}
.pile{display:flex; flex-direction:column; align-items:center; gap:6px}
.pile .stack{position:relative; width:58px; height:81px}
.pile .lbl{font:600 14px/1 var(--font-body); color:var(--text); text-shadow:0 1px 2px rgba(0,0,0,.8); letter-spacing:.01em; white-space:nowrap}
.card{
  position:absolute; width:58px; height:81px; border-radius:7px;
  box-shadow:0 1px 1px rgba(0,0,0,.5), 0 4px 6px rgba(0,0,0,.45), 0 10px 14px -4px rgba(0,0,0,.5);
}
.card.back{
  background:
    linear-gradient(135deg, rgba(255,255,255,.18), rgba(255,255,255,0) 40%),
    repeating-linear-gradient(45deg, #c4211b 0 5px, #a01a15 5px 10px);
  border:3px solid var(--cream);
  outline:1px solid rgba(26,31,43,.55); outline-offset:-1px;
}
.card.back::after{content:""; position:absolute; inset:4px; border:1.5px solid rgba(232,171,53,.85); border-radius:3px}
.card.face{
  background:linear-gradient(150deg,#ffffff 0%, var(--cream) 45%, #efe8db 100%);
  border:1px solid rgba(26,31,43,.35); color:#161a22;
}
.card .rk{position:absolute; left:5px; top:3px; font:600 17px/1 var(--font-display); color:var(--red)}
.card .rk.b{left:auto; right:5px; top:auto; bottom:3px; transform:rotate(180deg)}
.card .fl{position:absolute; left:50%; top:50%; width:44%; transform:translate(-50%,-50%)}
.card.ink .rk{color:#161a22}

/* ---------- SEATS ---------- */
.seat{position:absolute; width:88px; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; z-index:4}
.badge{
  position:relative; width:56px; height:56px; border-radius:50%;
  background:conic-gradient(from 210deg,#f5d27a,#e8ab35 30%,#9b6a10 55%,#e8ab35 75%,#f5d27a);
  padding:3px;
  box-shadow:0 3px 6px rgba(0,0,0,.6), 0 8px 14px -2px rgba(0,0,0,.5), inset 0 1px 1px rgba(255,255,255,.6);
}
.badge .pic{width:100%; height:100%; border-radius:50%; overflow:hidden; box-shadow:inset 0 3px 6px rgba(0,0,0,.6), 0 0 0 2px #1a1308; background:var(--glow)}
.badge .pic svg{display:block; width:100%; height:100%}
.cnt{
  position:absolute; right:-8px; top:-4px; min-width:26px; height:26px; padding:0 5px;
  display:grid; place-items:center; border-radius:13px;
  background:var(--cream); color:var(--ink); border:2px solid var(--ink);
  font:600 14px/1 var(--font-body); box-shadow:0 2px 4px rgba(0,0,0,.55);
}
.plate{
  position:relative; margin-top:-1px; padding:4px 10px 5px; min-width:64px; max-width:88px; text-align:center;
  font:600 14px/1.15 var(--font-body); color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  background:linear-gradient(#26324a,#141b28); border-radius:9px;
  border:1px solid rgba(232,171,53,.7);
  box-shadow:0 3px 5px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.14);
}
.seat.turn .badge{box-shadow:0 0 0 3px rgba(255,214,120,.9), 0 0 22px 8px rgba(232,171,53,.6), 0 3px 6px rgba(0,0,0,.6); animation:glow 2.4s ease-in-out infinite}
.seat.turn .plate{border-color:var(--gold); color:#fff3d2}
@keyframes glow{50%{box-shadow:0 0 0 3px rgba(255,214,120,.65), 0 0 30px 12px rgba(232,171,53,.35), 0 3px 6px rgba(0,0,0,.6)}}
@media (prefers-reduced-motion:reduce){.seat.turn .badge{animation:none}}

/* seat slots (centres, % of table area) */
.slot-T {left:50%; top:9.5%}
.slot-LU{left:14.5%; top:30%}  .slot-RU{left:85.5%; top:30%}
.slot-LM{left:13%; top:45%}    .slot-RM{left:87%; top:45%}
.slot-LL{left:14.5%; top:63%}  .slot-RL{left:85.5%; top:63%}
.slot-ME{left:50%; top:100%}

/* ---------- DOCK: hand + draw ---------- */
.dock{position:relative; flex:0 0 auto; padding:46px 0 14px; display:flex; flex-direction:column; align-items:center; gap:8px; z-index:5}
.hand{position:relative; width:100%; height:104px; margin-bottom:6px}
.hand button.card{
  all:unset; box-sizing:border-box; position:absolute; bottom:12px; left:50%;
  width:62px; height:87px; border-radius:7px; cursor:pointer;
  background:linear-gradient(150deg,#ffffff 0%, var(--cream) 45%, #efe8db 100%);
  border:1px solid rgba(26,31,43,.4);
  box-shadow:-2px 2px 3px rgba(0,0,0,.45), -4px 8px 12px rgba(0,0,0,.45);
  transform-origin:50% 160%;
  transition:transform .15s;
}
.hand button.card:focus-visible{outline:3px solid var(--gold); outline-offset:2px}
.hand button.card .rk{font-size:19px}
.hand button.card:active{transform:var(--t) translateY(-8px)}
.draw{
  appearance:none; border:0; cursor:pointer; width:min(82%,320px); height:58px; border-radius:30px;
  font:600 26px/1 var(--font-display); letter-spacing:.12em; text-transform:uppercase; color:var(--cream);
  background:linear-gradient(#e0382f 0%, var(--red) 50%, #9a1812 100%);
  box-shadow:0 0 0 2px #5c0d0a, 0 0 0 4px rgba(232,171,53,.7), 0 8px 14px rgba(0,0,0,.6), inset 0 2px 2px rgba(255,255,255,.4), inset 0 -3px 5px rgba(0,0,0,.35);
  text-shadow:0 2px 2px rgba(0,0,0,.45);
}
.draw:active{transform:translateY(2px); background:linear-gradient(#c4211b,var(--red-hover))}
.draw:focus-visible{outline:3px solid var(--text); outline-offset:3px}

.testtag{position:absolute; left:8px; top:4px; font:500 14px/1 var(--font-body); color:var(--smoke); z-index:9; pointer-events:none}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="table" id="table">
    <div class="rail">
      <svg class="grain" aria-hidden="true"><filter id="leather"><feTurbulence type="fractalNoise" baseFrequency="0.55 0.8" numOctaves="3" seed="4"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#leather)"/></svg>
    </div>
    <div class="sheen"></div>
    <div class="stitch"></div>
    <div class="felt">
      <svg class="grain" aria-hidden="true"><filter id="wool"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="9"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#wool)"/></svg>
    </div>
    <div class="piles" id="piles"></div>
    <div id="seats"></div>
  </div>
</div>
<div class="dock">
  <div class="hand" id="hand"></div>
  <button class="draw" id="draw" type="button">Draw</button>
</div>

<script>
/* ===== Fake sample data only. No real player data. ===== */
var params = new URLSearchParams(location.search);
var PLAYERS = Math.max(2, Math.min(6, parseInt(params.get('players') || '6', 10) || 6)); /* 2 to 6, including you */
var TURN = parseInt(params.get('turn') || '1', 10);          /* which opponent (0-based) has the turn */
var OPPONENTS = [
  {name:'Mia',  n:7, skin:'#e2b48c', hair:'#3a2418', bg:'#6b2a2a', top:'#c4211b'},
  {name:'Dex',  n:5, skin:'#8d5a3b', hair:'#15110e', bg:'#1f4a5e', top:'#e8ab35'},
  {name:'Juno', n:9, skin:'#f1cfae', hair:'#b4531c', bg:'#3d2c63', top:'#4cc790'},
  {name:'Rae',  n:4, skin:'#c58c63', hair:'#2a1a12', bg:'#5a4a1c', top:'#ff5a4f'},
  {name:'Otis', n:6, skin:'#6b4430', hair:'#0f0c0a', bg:'#234a3a', top:'#fbf8f3'}
];
var SLOTS = {1:['T'], 2:['LU','RU'], 3:['LM','T','RM'], 4:['LL','LU','RU','RL'], 5:['LL','LU','T','RU','RL']};
var HAND = ['K','7','A','4','Q','9'];

function avatar(o){
  return '<svg viewBox="0 0 56 56" aria-hidden="true"><rect width="56" height="56" fill="'+o.bg+'"/>'
   +'<circle cx="28" cy="70" r="30" fill="'+o.top+'"/>'
   +'<rect x="23" y="30" width="10" height="10" fill="'+o.skin+'"/>'
   +'<ellipse cx="28" cy="23" rx="11" ry="12.5" fill="'+o.skin+'"/>'
   +'<path d="M16.5 22c-1-9 6-14 12-14s12 5 11 14c-3-5-6-7-11-7s-9 2-12 7z" fill="'+o.hair+'"/>'
   +'<circle cx="23.5" cy="24" r="1.4" fill="#1a1f2b"/><circle cx="32.5" cy="24" r="1.4" fill="#1a1f2b"/>'
   +'<path d="M24 30q4 3 8 0" stroke="#1a1f2b" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>';
}
var FLAME='<svg class="fl" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5c1.5 4.6 7.2 6.6 7.2 13a7.2 7.2 0 0 1-14.4 0c0-3.6 2.4-5 3.2-8.2 1.4 1.2 2 .6 2.5-1.2.5-1.2.9-2.4 1.5-3.6z" fill="#c4211b"/><path d="M12 11c.9 2.6 3.6 3.6 3.6 6.6a3.6 3.6 0 0 1-7.2 0c0-1.8 1.2-2.6 1.6-4.2.7.7 1.4.3 1.6-.8z" fill="#e8ab35"/></svg>';

function seat(o, slot, turn, you){
  return '<div class="seat slot-'+slot+(turn?' turn':'')+'" data-seat="'+o.name+'">'
   +'<div class="badge"><div class="pic">'+avatar(o)+'</div><span class="cnt" aria-label="'+o.n+' cards">'+o.n+'</span></div>'
   +'<div class="plate">'+o.name+'</div></div>';
}
(function build(){
  var others = PLAYERS-1, slots = SLOTS[others], html='';
  for (var i=0;i<others;i++){ html += seat(OPPONENTS[i], slots[i], i===(TURN % others)); }
  html += seat({name:'You', n:HAND.length, skin:'#d9a57c', hair:'#241810', bg:'#2c3b4d', top:'#e8ab35'}, 'ME', false, true);
  document.getElementById('seats').innerHTML = html;

  document.getElementById('piles').innerHTML =
    '<div class="pile"><div class="stack" role="img" aria-label="Draw pile, 38 cards">'
     +'<div class="card back" style="left:0;top:0"></div><div class="card back" style="left:-1px;top:-2px"></div><div class="card back" style="left:1px;top:-4px;transform:rotate(-2deg)"></div></div><div class="lbl">Draw 38</div></div>'
    +'<div class="pile"><div class="stack" role="img" aria-label="Played pile, top card queen">'
     +'<div class="card face" style="left:-3px;top:1px;transform:rotate(-7deg)"><span class="rk">9</span></div>'
     +'<div class="card face" style="left:3px;top:-1px;transform:rotate(5deg)"><span class="rk">4</span></div>'
     +'<div class="card face" style="left:0;top:-3px;transform:rotate(-1deg)"><span class="rk">Q</span><span class="rk b">Q</span>'+FLAME+'</div></div><div class="lbl">Played</div></div>';

  var h = document.getElementById('hand'), n = HAND.length, out='', mid=(n-1)/2;
  var step = Math.min(44, (window.innerWidth - 96) / (n-1)); /* keep the whole fan on screen */
  for (var j=0;j<n;j++){
    var d=j-mid, rot=d*5, lift=Math.abs(d)*Math.abs(d)*1.6;
    var t='translateX(calc(-50% + '+(d*step)+'px)) translateY('+lift+'px) rotate('+rot+'deg)';
    out += '<button type="button" class="card" aria-label="Card '+HAND[j]+'" style="--t:'+t+';transform:'+t+';z-index:'+(j+1)+'">'
         + '<span class="rk">'+HAND[j]+'</span>'+FLAME+'</button>';
  }
  h.innerHTML = out;
})();
</script>
</body>
</html>
